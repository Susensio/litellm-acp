[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litellm-acp"
version = "0.1.0"
description = "Bring-Your-Own-Subscription: route LiteLLM completions through local Agent Client Protocol (ACP) CLI agents instead of pay-per-token APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "susensio", email = "susensio@gmail.com" }]
keywords = [
    "litellm",
    "acp",
    "agent-client-protocol",
    "llm",
    "claude",
    "codex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "litellm>=1.55.0",
    "agent-client-protocol>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/susensio/litellm-acp"
Repository = "https://github.com/susensio/litellm-acp"
Issues = "https://github.com/susensio/litellm-acp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_acp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
