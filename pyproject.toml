[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litellm-acp"
version = "0.1.0"
description = "Bring-Your-Own-Subscription: route LiteLLM completions through local Agent Client Protocol (ACP) CLI agents instead of pay-per-token APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "susensio", email = "susensio@gmail.com" }]
keywords = [
    "litellm",
    "acp",
    "agent-client-protocol",
    "llm",
    "claude",
    "codex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "litellm>=1.55.0",
    "agent-client-protocol>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/susensio/litellm-acp"
Repository = "https://github.com/susensio/litellm-acp"
Issues = "https://github.com/susensio/litellm-acp/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_adapter: requires a locally installed and authenticated ACP adapter",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "python-semantic-release>=10.6.2",
    "ruff>=0.11",
    "ty>=0.0.5",
]

[tool.semantic_release]
version_source = "pep621"
version_toml = ["pyproject.toml:project.version"]
build_command = """
uv lock --upgrade-package \"$PACKAGE_NAME\"
git add uv.lock
"""
allow_zero_version = true
major_on_zero = false
